<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101318"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><title>WorldChef3D</title><link rel="stylesheet" href="./style.css"></head>
<body><div id="app"><canvas id="game"></canvas>
<header class="topbar"><div class="stat level"><span class="star">★</span><div><b id="level">1</b><small>LEVEL</small></div></div><div class="xp"><div class="xp-track"><span id="xpBar"></span></div><small id="xpText">0 / 100 XP</small></div><div class="stat"><span>🪙</span><b id="cash">$500</b></div><div class="stat"><span>💎</span><b id="gems">10</b></div><div class="stat restaurant-stat"><span>🏪</span><b id="restaurantLevel">1</b></div></header>
<div class="rep">⭐ <span id="rep">100%</span></div><section class="orders" id="orders"></section><div class="toast" id="toast"></div>
<div class="side-actions"><button id="eventBtn" class="round-btn">⚡<small>Eventos</small></button><button id="inventoryBtn" class="round-btn">📦<small>Inventario</small></button><button id="employeesBtn" class="round-btn">👥<small>Personal</small></button><button id="contractsBtn" class="round-btn">📋<small>Contratos</small></button><button id="achievementsBtn" class="round-btn">🏆<small>Logros</small></button><button id="settingsBtn" class="round-btn">⚙️<small>Ajustes</small></button><button id="upgradesBtn" class="round-btn">🔧<small>Cocina</small></button></div>
<section class="station-panel"><div class="station-title"><span id="stationName">Parrilla</span><span id="stationInfo">Nivel 1</span></div><div class="ingredient-row" id="ingredients"></div><button id="serveBtn" class="secondary">SERVIR ORDEN SELECCIONADA</button><button id="cookBtn" class="primary">COCINAR 🍔 HAMBURGUESA <span id="cookTime">7s</span></button></section>
<nav class="bottom-nav"><button class="active">🍳<small>Cocina</small></button><button id="restaurantBtn">🏪<small>Restaurante</small></button><button id="recipesBtn">📖<small>Recetas</small></button><button id="worldBtn">🌎<small>Mundo</small></button></nav>
<div id="modal" class="modal hidden"><div class="modal-card"><button id="closeModal" class="close">×</button><div id="modalContent"></div></div></div></div><script type="module" src="./game.js?v=94"></script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js?v=94").then(r=>r.update()).catch(()=>{})}</script></body></html>
