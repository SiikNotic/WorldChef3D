<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101318">
<title>WorldChef3D</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<header class="topbar">
<div class="stat level"><span class="star">★</span><div><b id="level">1</b><small>LEVEL</small></div></div>
<div class="xp"><div class="xp-track"><span id="xpBar"></span></div><small id="xpText">0 / 120 XP</small></div>
<div class="stat"><span>🪙</span><b id="cash">$500</b></div>
<div class="stat"><span>💎</span><b id="gems">10</b></div>
</header>
<section class="orders" id="orders"></section>
<div class="toast" id="toast" aria-live="polite"></div>
<div class="side-actions">
<button id="inventoryBtn" class="round-btn">📦<small>Inventario</small></button>
<button id="contractsBtn" class="round-btn">📋<small>Contratos</small></button>
<button id="upgradesBtn" class="round-btn">🔧<small>Mejoras</small></button>
</div>
<section class="station-panel">
<div class="station-title"><span id="stationName">Parrilla</span><span id="stationInfo">Nivel 1 · 1 plato</span></div>
<div class="ingredient-row" id="ingredients"></div>
<button id="cookBtn" class="primary">COCINAR HAMBURGUESA <span id="cookTime">10s</span></button>
</section>
<nav class="bottom-nav">
<button class="active">🍳<small>Cocina</small></button>
<button id="restaurantBtn">🏪<small>Restaurante</small></button>
<button id="recipesBtn">📖<small>Recetas</small></button>
<button id="worldBtn">🌎<small>Mundo</small></button>
</nav>
<div id="modal" class="modal hidden"><div class="modal-card"><button id="closeModal" class="close">×</button><div id="modalContent"></div></div></div>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>
